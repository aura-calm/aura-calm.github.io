<head>

<title>Lost in the clouds — Aura</title>

<meta name="theme-color" content="#060918">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;color:#eef1ff;
    font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
    background:radial-gradient(ellipse at 30% 20%,rgba(43,227,181,.25),transparent 55%),radial-gradient(ellipse at 75% 70%,rgba(123,92,255,.3),transparent 55%),#060918;overflow-x:hidden}
  .orb{width:140px;height:140px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,rgba(255,255,255,.2) 30%,transparent 55%),conic-gradient(#2be3b5,#7b5cff,#ff6ec7,#2be3b5);
    box-shadow:0 0 80px -10px #7b5cff;animation:b 8s ease-in-out infinite}
  @keyframes b{0%,100%{transform:scale(.8)}50%{transform:scale(1)}}
  h1{font-weight:300;font-size:clamp(2rem,7vw,3.4rem);margin:0 0 .3em}
  p{color:#b3b9dc;max-width:30rem;margin:0 auto 1.4em;line-height:1.6}
  a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:linear-gradient(120deg,#7ef0d0,#b49bff);color:#061420;font-weight:700;text-decoration:none}
  a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  small{display:block;margin-top:28px;color:#8f96bf}
  small a{color:#7ef0d0}
  @media (prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>This page drifted off</h1>
  <p>Like a thought during meditation, it wandered away. That’s okay — simply come back. Breathe in… breathe out… and tap below.</p>
